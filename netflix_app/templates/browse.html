{% extends "base.html" %}

{% block title %}Browse - StreamFlix{% endblock %}

{% block content %}
<section class="browse-section">
    <div class="browse-header">
        <h1 class="browse-title">Browse All</h1>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Action">Action</button>
            <button class="filter-btn" data-filter="Drama">Drama</button>
            <button class="filter-btn" data-filter="Comedy">Comedy</button>
            <button class="filter-btn" data-filter="Sci-Fi">Sci-Fi</button>
            <button class="filter-btn" data-filter="Thriller">Thriller</button>
        </div>
    </div>
    
    <div class="browse-grid" id="browseGrid">
        <!-- Movies will be loaded here by JavaScript -->
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadAllMovies();
        setupFilterButtons();
    });

    function loadAllMovies() {
        fetch('/api/movies')
            .then(response => response.json())
            .then(data => {
                displayBrowseMovies(data.movies);
            })
            .catch(error => console.error('Error loading movies:', error));
    }

    function displayBrowseMovies(movies) {
        const grid = document.getElementById('browseGrid');
        grid.innerHTML = '';
        
        movies.forEach(movie => {
            const card = createMovieCard(movie);
            grid.appendChild(card);
        });
    }

    function setupFilterButtons() {
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const filter = this.dataset.filter;
                
                if (filter === 'all') {
                    loadAllMovies();
                } else {
                    fetch(`/api/movies/category/${filter}`)
                        .then(response => response.json())
                        .then(data => {
                            displayBrowseMovies(data.movies);
                        })
                        .catch(error => console.error('Error filtering movies:', error));
                }
            });
        });
    }
</script>
{% endblock %}
